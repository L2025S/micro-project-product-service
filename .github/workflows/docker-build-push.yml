name: Build and Push Docker Image

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:  # Added: lets you manually trigger this workflow from the Actions tab for debugging, without needing a PR merge

jobs:
  build-and-push:

    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    # Updated: allow the job to run on manual trigger too, not just on a merged PR

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true  # Changed from false to true: also removes pre-installed images on the runner to free up more disk space
          swap-storage: true

      # Removed: "Set up JDK 21" step
      # Reason: Java setup is no longer needed on the runner itself —
      # compilation now happens entirely inside the Docker build (Maven build stage in Dockerfile)

      # Removed: "Build with Maven" step
      # Reason: this was a redundant build. The Dockerfile's multi-stage build
      # already runs `mvn package` inside the container. Building twice
      # (once on the runner, once inside Docker) wasted disk space and time,
      # and the runner-side build output wasn't even used by the Docker build.

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Check disk space before build
        run: df -h
        # Added: quick diagnostic so if the build fails again, we can see
        # exactly how much disk space was available beforehand

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false  # Added: disables SBOM/provenance attestation generation, which adds extra
          sbom: false         # metadata writes during the build — turning both off reduces disk/cache usage

      - name: Check disk space after build
        if: always()
        run: df -h
        # Added: runs even if the build step fails, so we can see how much
        # disk space was left (or if it hit 0) right when the failure happened