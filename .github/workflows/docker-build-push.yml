name: Build and Push Docker Image

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:  # lets you manually trigger this workflow from the Actions tab for debugging, without needing a PR merge

jobs:
  build-and-push:

    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        # Upgraded from v3 to v4: v3 still speaks the legacy Actions Cache API,
        # which is the root cause of the "failed to reserve cache" error

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        # Upgraded from v6 to v7: same reason as above — runs on a newer
        # BuildKit/Cache API that isn't affected by the legacy reserve-cache bug
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          # Removed cache-from / cache-to (type=gha) entirely:
          # this cache export step was what kept failing with
          # "error writing layer blob: failed to reserve cache" —
          # a known issue with the GHA cache backend (either the legacy
          # cache API or GitHub's new low-trust-trigger cache write restriction).
          # Since the cache was providing negligible speed benefit here,
          # dropping it removes the failure point without slowing the build down.